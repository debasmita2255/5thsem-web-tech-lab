<!doctype html>
<html>
  <head>
    <title>Header</title>
    <script>
      (function () {
        try {
          document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("qb_theme") || "light",
          );
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body bgcolor="#003366" text="#FFFFFF">
    <center>
      <h1><font face="Arial">B.Tech Question Bank Portal</font></h1>
      <hr width="80%" color="#FFFFFF" />
      <p>
        <font face="Verdana" size="3"
          >Access previous years' papers easily.</font
        >
      </p>
      <p>
        <font face="Verdana" size="2">Theme:</font>
        <span class="theme-switcher">
          <button type="button" data-theme-option="light">Light</button>
          <button type="button" data-theme-option="dark">Dark</button>
          <button type="button" data-theme-option="contrast">
            High Contrast
          </button>
        </span>
      </p>
    </center>
    <script src="theme.js"></script>
  </body>
</html>
