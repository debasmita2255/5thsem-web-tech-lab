<html>
  <head>
    <title>SGPA Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="calculator-container">
      <h1>SGPA Calculator</h1>
      <p>Enter your marks (0-100) for 5 subjects:</p>

      <div class="inputs">
        <div class="input-row">
          <input
            type="number"
            class="subject-mark"
            placeholder="Subject 1 Marks"
          />
          <input
            type="number"
            class="subject-credit"
            placeholder="Credit (e.g., 3)"
          />
        </div>
        <div class="input-row">
          <input
            type="number"
            class="subject-mark"
            placeholder="Subject 2 Marks"
          />
          <input
            type="number"
            class="subject-credit"
            placeholder="Credit (e.g., 3)"
          />
        </div>
        <div class="input-row">
          <input
            type="number"
            class="subject-mark"
            placeholder="Subject 3 Marks"
          />
          <input
            type="number"
            class="subject-credit"
            placeholder="Credit (e.g., 4)"
          />
        </div>
        <div class="input-row">
          <input
            type="number"
            class="subject-mark"
            placeholder="Subject 4 Marks"
          />
          <input
            type="number"
            class="subject-credit"
            placeholder="Credit (e.g., 2)"
          />
        </div>
        <div class="input-row">
          <input
            type="number"
            class="subject-mark"
            placeholder="Subject 5 Marks"
          />
          <input
            type="number"
            class="subject-credit"
            placeholder="Credit (e.g., 2)"
          />
        </div>
      </div>

      <button id="calculateBtn">Calculate Result</button>
      <p id="error-message"></p>

      <div id="resultBox" class="hidden"></div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
